<!doctype html>
<html lang="nl">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --ink: #17333b;
      --muted: #62737a;
      --line: #d9e3e5;
      --primary: #0f6f86;
      --primary-dark: #0a5668;
      --accent: #e76f2e;
      --surface: #ffffff;
      --soft: #f2f7f7;
      --warm: #fff7f1;
      --ok: #e9f6ee;
      --ok-line: #add3bb;
      --danger: #fff0ea;
      --danger-line: #edc0aa;
      --shadow: 0 18px 48px rgba(15, 55, 65, .09);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f9f9;
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
      line-height: 1.55;
    }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .container { width: min(calc(100% - 2rem), 1120px); margin-inline: auto; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
    .topbar-row { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { display: flex; align-items: center; gap: .75rem; }
    .mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; background: var(--primary); color: white; font-weight: 800; }
    .brand strong, .brand span { display: block; }
    .brand span { color: var(--muted); font-size: .8rem; }
    .account { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; text-align: right; }
    .hero { padding: 3.5rem 0 2rem; background: linear-gradient(135deg, #eaf4f5, var(--warm)); border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 .55rem; color: var(--accent); font-size: .76rem; font-weight: 800; text-transform: uppercase; letter-spacing: .11em; }
    h1, h2, h3 { line-height: 1.18; margin-top: 0; }
    h1 { margin-bottom: .85rem; font-size: clamp(2.25rem, 6vw, 4.5rem); letter-spacing: -.04em; }
    h2 { font-size: clamp(1.45rem, 3vw, 2rem); }
    h3 { margin-bottom: .45rem; font-size: 1.12rem; }
    .lead { max-width: 720px; color: var(--muted); font-size: 1.08rem; }
    .roles { display: flex; flex-wrap: wrap; gap: .45rem; margin: 1.2rem 0 0; padding: 0; list-style: none; }
    .roles li, .badge { display: inline-flex; align-items: center; border-radius: 999px; font-weight: 750; }
    .roles li { padding: .35rem .65rem; background: #fff; border: 1px solid var(--line); color: var(--primary); font-size: .82rem; }
    .view-nav-wrap { position: sticky; top: 0; z-index: 10; background: rgba(245,249,249,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
    .view-nav { display: flex; gap: .5rem; padding: .85rem 0; overflow-x: auto; }
    .view-nav a { white-space: nowrap; padding: .65rem .9rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); text-decoration: none; font-weight: 750; }
    .view-nav a[aria-current="page"] { border-color: var(--primary); background: var(--primary); color: #fff; }
    main { padding: 2rem 0 4rem; }
    .section { margin-top: 2rem; }
    .section:first-child { margin-top: 0; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .section-head h2 { margin-bottom: .2rem; }
    .section-head p { margin: 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .portal-card { min-height: 190px; display: flex; flex-direction: column; gap: .65rem; padding: 1.2rem; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); box-shadow: var(--shadow); text-decoration: none; }
    a.portal-card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .portal-card p { margin: 0; color: var(--muted); }
    .portal-card .action { margin-top: auto; color: var(--primary); font-weight: 800; }
    .badge { align-self: flex-start; padding: .27rem .55rem; background: var(--soft); color: var(--primary); font-size: .74rem; }
    .notice { padding: 1rem; border-radius: 13px; margin: 1rem 0; }
    .ok { background: var(--ok); border: 1px solid var(--ok-line); }
    .no { background: var(--danger); border: 1px solid var(--danger-line); }
    .denied { width: min(calc(100% - 2rem), 760px); margin: 4rem auto; padding: 1.6rem; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
    .button { display: inline-block; margin-top: 1rem; padding: .75rem 1rem; border-radius: 10px; background: var(--primary); color: #fff; text-decoration: none; font-weight: 750; }
    .button:hover { background: var(--primary-dark); }
    footer { padding: 1.5rem 0 2rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 580px) {
      .topbar-row { align-items: flex-start; padding: .85rem 0; }
      .account { max-width: 45%; font-size: .76rem; }
      .hero { padding-top: 2.5rem; }
      .grid { grid-template-columns: 1fr; }
      .section-head { display: block; }
    }
  </style>
</head>
<body>
  <? if (access.allowed) { ?>
    <header class="topbar">
      <div class="container topbar-row">
        <div class="brand">
          <span class="mark" aria-hidden="true">VSZ</span>
          <span><strong>ICT-portaal</strong><span><?= config.school.name ?></span></span>
        </div>
        <div class="account"><strong>Ingelogd als</strong><br><?= access.email ?></div>
      </div>
    </header>

    <section class="hero">
      <div class="container">
        <p class="eyebrow"><?= portal.eyebrow ?></p>
        <h1><?= portal.title ?></h1>
        <p class="lead"><?= portal.intro ?></p>
        <ul class="roles" aria-label="Toegekende rollen">
          <? access.roles.forEach(function(role) { ?>
            <li><?= roleLabels[role] || role ?></li>
          <? }); ?>
        </ul>
      </div>
    </section>

    <? if (portal.views.length > 1) { ?>
      <div class="view-nav-wrap">
        <nav class="container view-nav" aria-label="Beveiligde portaalweergaven">
          <? portal.views.forEach(function(view) { ?>
            <a href="?view=<?= view.id ?>" <? if (view.id === portal.activeView) { ?>aria-current="page"<? } ?>><?= view.label ?></a>
          <? }); ?>
        </nav>
      </div>
    <? } ?>

    <main>
      <div class="container">
        <? portal.sections.forEach(function(section) { ?>
          <section class="section" aria-labelledby="section-<?= section.id ?>">
            <div class="section-head">
              <div>
                <h2 id="section-<?= section.id ?>"><?= section.label ?></h2>
                <p><?= section.description ?></p>
              </div>
            </div>
            <div class="grid">
              <? section.items.forEach(function(item) { ?>
                <? if (item.url) { ?>
                  <a class="portal-card" href="<?= item.url ?>" <? if (item.external) { ?>target="_blank" rel="noopener"<? } ?>>
                    <span class="badge"><?= item.badge ?></span>
                    <div><h3><?= item.title ?></h3><p><?= item.text ?></p></div>
                    <span class="action"><?= item.external ? 'Openen ↗' : 'Openen →' ?></span>
                  </a>
                <? } else { ?>
                  <article class="portal-card">
                    <span class="badge"><?= item.badge ?></span>
                    <div><h3><?= item.title ?></h3><p><?= item.text ?></p></div>
                  </article>
                <? } ?>
              <? }); ?>
            </div>
          </section>
        <? }); ?>
      </div>
    </main>

    <footer>
      <div class="container">
        Deze omgeving controleert je school en rollen bij ieder nieuw bezoek. · <a href="<?= config.publicPortalUrl ?>">Openbaar ICT-portaal</a>
      </div>
    </footer>
  <? } else { ?>
    <main class="denied">
      <p class="eyebrow">Google Workspace</p>
      <h1>Geen toegang</h1>
      <div class="notice no"><strong>Toegang geweigerd.</strong> <?= access.reason ?></div>
      <? if (access.email) { ?><p>Gebruikt account: <strong><?= access.email ?></strong></p><? } ?>
      <a class="button" href="<?= config.publicPortalUrl ?>">Terug naar het openbare ICT-portaal</a>
    </main>
  <? } ?>
</body>
</html>
